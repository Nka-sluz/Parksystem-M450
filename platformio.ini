; Parksystem M450 – zwei Firmwares für 2 × Raspberry Pi Pico W (Arduino, C++17)
;
;   pio run -e kasse      -t upload   → Pico 1 "Kasse"     (Leitstelle, Access Point, Weboberfläche Kasse)
;   pio run -e schranken  -t upload   → Pico 2 "Schranken" (Ein-/Ausfahrtsschranke, Kamera-Simulation)
;
; Gemeinsame Logik liegt in lib/ParkCore, zentrale Konstanten in include/Config.h.

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_unflags = -std=gnu++17 -std=gnu++14 -std=gnu++11
; -I include: auch lib/ParkCore soll die zentrale Config.h sehen
build_flags = -std=gnu++17 -I include
build_src_flags = -Wall -Wextra

[env:kasse]
build_src_filter = +<kasse/>

[env:schranken]
build_src_filter = +<schranken/>
